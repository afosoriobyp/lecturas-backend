services:
  - type: web
    name: lectura-medidor-api
    runtime: docker
    repo: https://github.com/afosoriobyp/lecturas-backend
    branch: main
    dockerfilePath: ./Dockerfile
    dockerContext: .
    envVars:
      - key: APP_NAME
        value: "Lectura Medidor API"
      - key: APP_VERSION
        value: "0.2.0"
      - key: APP_DEBUG
        value: "false"
      - key: API_PREFIX
        value: ""
      - key: DATABASE_URL
        fromDatabase:
          name: lectura-medidor-db
          property: connectionString
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: JWT_ALGORITHM
        value: "HS256"
      - key: JWT_ACCESS_TOKEN_EXPIRE_MINUTES
        value: "60"
      - key: JWT_REFRESH_TOKEN_EXPIRE_DAYS
        value: "7"
      - key: CORS_ORIGINS
        value: '["https://tudominio-frontend.com"]'
      - key: LOG_LEVEL
        value: "INFO"
      - key: LOG_FORMAT
        value: "json"
      - key: UPLOAD_DIR
        value: "uploads"
      - key: MAX_IMAGE_SIZE_MB
        value: "5"

databases:
  - name: lectura-medidor-db
    plan: starter
    databaseName: lectura_medidor
    user: lectura_user
